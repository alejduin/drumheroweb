services:
  poc:
    build:
      context: .
      # En WSL la red puente de Docker corta descargas largas; la del host no
      network: host
    image: drumhero-worker:dev
    # Igual que en el build: la red puente de WSL deja colgadas las descargas de pesos
    network_mode: host
    volumes:
      # Código montado para iterar sin reconstruir la imagen
      - ./app:/work/app
      - ./poc:/work/poc
      - ./tests:/work/tests
      - ./ruff.toml:/work/ruff.toml:ro
      - ../shared:/shared:ro
      - models:/models
    environment:
      DRUMHERO_SHARED_DIR: /shared
      # cpu | cuda | auto
      DRUMHERO_DEVICE: ${DRUMHERO_DEVICE:-auto}
  # Servicio HTTP (B11): docker compose up worker → http://localhost:8000/v1/health
  worker:
    image: drumhero-worker:dev
    network_mode: host
    entrypoint: ["uvicorn", "--factory", "app.api.main:build_app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./app:/work/app
      - ../shared:/shared:ro
      - models:/models
      # Cola (SQLite), caché de análisis y stems generados
      - data:/data
    environment:
      DRUMHERO_SHARED_DIR: /shared
      DRUMHERO_DEVICE: ${DRUMHERO_DEVICE:-auto}
      STORAGE_BACKEND: local
      DRUMHERO_DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-1}
  # Modo nube (B12): recoge los trabajos de Supabase. Requiere worker/.env (ver .env.example)
  cloud-worker:
    image: drumhero-worker:dev
    network_mode: host
    entrypoint: ["python", "-m", "app.cloud"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./app:/work/app
      - ../shared:/shared:ro
      - models:/models
      - cloud-work:/data
    environment:
      DRUMHERO_SHARED_DIR: /shared
      DRUMHERO_DEVICE: ${DRUMHERO_DEVICE:-auto}
      DRUMHERO_DATA_DIR: /data
volumes:
  models:
  data:
  cloud-work:
